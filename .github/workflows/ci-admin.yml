name: CI admin

# Back-office (/admin/) : installation + build Vite à chaque PR et push sur main / dev_*
on:
  push:
    branches: [main, 'dev_*']
    paths: ['frontend/admin/**', '.github/workflows/ci-admin.yml']
  pull_request:
    paths: ['frontend/admin/**', '.github/workflows/ci-admin.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/admin/dist
          retention-days: 7
