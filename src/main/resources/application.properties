spring.application.name=autoloc-api
# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
# Pas de SQL dans les logs en production (profil dev pour le détail) : gain de temps de réponse
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool de connexions et cache des requêtes préparées MySQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# Réponses compressées, JMX inutile
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
spring.jmx.enabled=false

# Logs
logging.level.org.hibernate.SQL=WARN
logging.level.autoloc=INFO

# Messages d'erreur affichés par l'interface React
server.error.include-message=always

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.distribution.percentiles-histogram[http.server.requests]=true

# Avertissement attendu : le fournisseur d'authentification (avec cache) est déclaré explicitement
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
