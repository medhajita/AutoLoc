spring.application.name=autoloc-api
# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=INFO

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
